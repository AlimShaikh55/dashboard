<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azraah Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2A0F33; --ink2:#3D1747; --gold:#C9973F; --gold-l:#F5E6C4;
  --bg:#F3F1F6; --card:#FFFFFF; --line:#E6E0EA; --line2:#D6CEDC;
  --tx:#1F1724; --tx2:#5C5065; --tx3:#8A8092;
  --pend:#B86E0B; --pend-b:#FDF0DC; --conf:#6B2A72; --conf-b:#F3E7F5;
  --deliv:#2B7148; --deliv-b:#E3F2E8; --canc:#7E7586; --canc-b:#EDEAF0;
  --red:#B3261E; --red-b:#FCE8E6;
  --r:12px; --r-s:8px;
  --shadow:0 1px 2px rgba(42,15,51,.06),0 4px 16px rgba(42,15,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
a{color:var(--conf)}
.serif{font-family:'Cormorant Garamond',Georgia,serif}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.side{background:var(--ink);color:#EDE3F0;display:flex;flex-direction:column;padding:22px 14px;position:sticky;top:0;height:100vh}
.brand{padding:0 10px 22px}
.brand b{display:block;font-family:'Cormorant Garamond',serif;font-size:30px;line-height:1;color:var(--gold)}
.brand small{font-size:12px;color:#BFAFC6}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;color:#D9CCDF;padding:10px 12px;border-radius:var(--r-s);font-size:14px;font-weight:500;text-align:left;position:relative}
.nav button svg{width:18px;height:18px;flex-shrink:0;opacity:.85}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:rgba(201,151,63,.14);color:#fff}
.nav button.on::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
.nav .ct{margin-left:auto;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;border-radius:20px;padding:1px 7px}
.side-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.1);font-size:12px;color:#BFAFC6;line-height:1.6}
.side-foot a{color:var(--gold-l)}
main{min-width:0;padding:26px 32px 60px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:700;color:var(--ink);line-height:1}
.top .sp{flex:1}
.upd{font-size:12px;color:var(--tx3)}
.demo{background:var(--gold-l);color:#5A3E07;border-radius:var(--r-s);padding:9px 12px;font-size:13px;margin-bottom:18px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:38px;padding:0 15px;border-radius:var(--r-s);border:1px solid var(--line2);background:#fff;font-weight:600;font-size:13.5px;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:var(--tx3)}
.btn.p{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.p:hover{background:var(--ink2)}
.btn.g{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.btn.d{color:var(--red);border-color:#EBC5C1}
.btn.s{height:32px;padding:0 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:16px;height:16px}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line2);border-radius:var(--r-s);padding:3px}
.seg button{border:none;background:none;padding:6px 11px;border-radius:6px;font-size:13px;font-weight:600;color:var(--tx2)}
.seg button.on{background:var(--ink);color:#fff}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:#fff;border-radius:20px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--tx2);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip i{font-style:normal;font-weight:700;opacity:.7}
.search{height:38px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 12px;background:#fff;min-width:220px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin:14px 0 6px}
.in{width:100%;height:40px;border:1px solid var(--line2);border-radius:var(--r-s);padding:0 11px;background:#fff}
textarea.in{height:auto;min-height:150px;padding:10px 11px;line-height:1.55;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13.5px;color:var(--tx2)}
.check input{width:17px;height:17px;accent-color:var(--ink)}
.hint{font-size:12px;color:var(--tx3);margin-top:5px;line-height:1.45}

/* ---------- panels ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{display:flex;align-items:center;gap:10px;padding:16px 18px 0}
.panel-h h2{font-size:15px;font-weight:700}
.panel-h .sp{flex:1}
.panel-b{padding:14px 18px 18px}
.grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.grid2.even{grid-template-columns:1fr 1fr}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .sp{flex:1}

/* overview hero */
.hero{padding:22px 24px 0}
.hero p.lead{font-family:'Cormorant Garamond',serif;font-size:44px;line-height:1.05;color:var(--ink);font-weight:700;max-width:22ch}
.hero p.sub{color:var(--tx2);margin-top:8px}
.ledger{display:grid;grid-template-columns:repeat(5,1fr);margin-top:20px;border-top:1px solid var(--line)}
.ledger div{padding:14px 24px 18px;border-right:1px solid var(--line)}
.ledger div:last-child{border-right:none}
.ledger b{display:block;font-size:22px;font-weight:700;color:var(--tx)}
.ledger span{font-size:12.5px;color:var(--tx3)}
.ledger .warn b{color:var(--pend)}

/* attention list */
.todo{display:flex;flex-direction:column}
.todo button{display:flex;align-items:center;gap:12px;border:none;background:none;text-align:left;padding:11px 0;border-bottom:1px solid var(--line)}
.todo button:last-child{border-bottom:none}
.todo .ic{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}
.todo .tx{flex:1;min-width:0}
.todo .tx b{display:block;font-size:14px}
.todo .tx small{color:var(--tx3);font-size:12.5px}
.todo .go{color:var(--tx3);font-size:18px}
.empty{color:var(--tx3);padding:22px 4px;text-align:center;line-height:1.6}

/* tables */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;font-weight:600;color:var(--tx3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl .r{text-align:right}
.tbl tbody tr.click{cursor:pointer}
.tbl tbody tr.click:hover{background:#FAF8FB}
.tbl small{color:var(--tx3);font-size:12px}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:3px 9px;white-space:nowrap}
.st-Pending{background:var(--pend-b);color:var(--pend)}
.st-Confirmed{background:var(--conf-b);color:var(--conf)}
.st-Packed{background:var(--conf-b);color:var(--conf)}
.st-Delivered{background:var(--deliv-b);color:var(--deliv)}
.st-Cancelled{background:var(--canc-b);color:var(--canc)}
.pay-Paid{background:var(--deliv-b);color:var(--deliv)}
.pay-Unpaid{background:var(--red-b);color:var(--red)}
.lv-ok{background:var(--deliv-b);color:var(--deliv)}
.lv-low{background:var(--pend-b);color:var(--pend)}
.lv-out{background:var(--red-b);color:var(--red)}
.lv-na{background:var(--canc-b);color:var(--canc)}
.seg-pill{background:#F1ECF4;color:var(--ink2)}
.bar{height:6px;border-radius:4px;background:#EFEAF2;overflow:hidden;min-width:70px}
.bar i{display:block;height:100%;background:var(--deliv)}
.bar.low i{background:var(--pend)}
.bar.out i{background:var(--red)}
.tog{position:relative;width:40px;height:23px;border-radius:20px;border:none;background:#D6CEDC;flex-shrink:0;transition:background .2s}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tog.on{background:var(--deliv)}
.tog.on::after{transform:translateX(17px)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(31,23,36,.35);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s linear .2s;z-index:40}
.scrim.on{opacity:1;visibility:visible;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:#fff;z-index:41;transform:translateX(102%);transition:transform .28s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(42,15,51,.18)}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line)}
.dr-h h3{font-family:'Cormorant Garamond',serif;font-size:26px;color:var(--ink);line-height:1.1}
.dr-h .sp{flex:1}
.x{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:#fff;font-size:20px;line-height:1}
.dr-b{flex:1;overflow-y:auto;padding:6px 22px 24px}
.dr-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;background:#FCFBFD}
.sec{padding:16px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.sec h4{font-size:12.5px;font-weight:700;color:var(--tx3);margin-bottom:9px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv span{color:var(--tx3)}
.contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.lines td{padding:8px 0;border-bottom:1px dashed var(--line)}
.lines tr.t td{border-bottom:none;font-weight:700;padding-top:10px}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.itemrow{display:grid;grid-template-columns:1fr 120px 36px;gap:8px;margin-bottom:8px}
.itemrow .x{width:36px;height:40px;border-radius:var(--r-s)}
.sum{background:#FAF8FB;border-radius:var(--r-s);padding:12px 14px;margin-top:12px;font-size:14px}
.sum div{display:flex;justify-content:space-between;padding:3px 0}
.sum .t{font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}

/* email */
.mail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.preview{width:100%;height:640px;border:1px solid var(--line);border-radius:var(--r-s);background:#FDF6EC}
.reclist{max-height:120px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);padding:6px 8px;margin-top:8px;font-size:12.5px;color:var(--tx2);line-height:1.7}
.merge{display:flex;gap:6px;margin-top:6px}
.merge button{border:1px dashed var(--line2);background:#fff;border-radius:6px;padding:3px 8px;font-size:12px;color:var(--tx2)}
.picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.picks label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line2);border-radius:20px;padding:4px 10px;font-size:12.5px;background:#fff}
.picks input{accent-color:var(--ink)}

/* funnel */
.funnel div{display:grid;grid-template-columns:110px 1fr 54px;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.funnel .b{height:26px;border-radius:6px;background:var(--gold-l);position:relative;overflow:hidden}
.funnel .b i{position:absolute;inset:0 auto 0 0;background:var(--gold)}
.funnel span{color:var(--tx2)}
.funnel b{text-align:right}

/* toast + loading */
.toast{visibility:hidden;position:fixed;left:50%;bottom:24px;transform:translate(-50%,140%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:60;transition:transform .3s;max-width:90vw;box-shadow:0 10px 30px rgba(42,15,51,.3)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast.err{background:var(--red)}
.loading{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:70;color:var(--tx2)}
.loading b{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--ink)}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--gold);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.busy{pointer-events:none;opacity:.6}

/* mobile */
.tabs{display:none}
.more-menu{display:none}
@media (max-width:980px){
  .grid2,.grid2.even,.mail{grid-template-columns:1fr}
  .ledger{grid-template-columns:repeat(2,1fr)}
  .ledger div{border-bottom:1px solid var(--line)}
  .ledger div:nth-child(2n){border-right:none}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:16px 14px 96px}
  .top h1{font-size:30px}
  .hero{padding:18px 18px 0}
  .hero p.lead{font-size:34px}
  .ledger div{padding:12px 18px 14px}
  .search{min-width:0;flex:1}
  .tabs{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--ink);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .tabs button{flex:1;border:none;background:none;color:#CDBFD3;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:6px 0;position:relative}
  .tabs button svg{width:21px;height:21px}
  .tabs button.on{color:var(--gold)}
  .tabs .ct{position:absolute;top:0;left:calc(50% + 6px);background:var(--gold);color:var(--ink);font-size:10px;border-radius:10px;padding:0 5px}
  .more-menu.on{display:block;position:fixed;left:10px;right:10px;bottom:76px;background:#fff;border-radius:14px;z-index:31;box-shadow:0 10px 40px rgba(42,15,51,.25);padding:8px}
  .more-menu button{display:flex;width:100%;gap:12px;align-items:center;border:none;background:none;padding:13px 12px;font-size:15px;font-weight:600;border-radius:10px}
  .more-menu svg{width:20px;height:20px;color:var(--ink)}
  .tbl.cards thead{display:none}
  .tbl.cards tr{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:12px 4px;border-bottom:1px solid var(--line)}
  .tbl.cards td{border:none;padding:0}
  .tbl.cards td.hide-m{display:none}
  .row3{grid-template-columns:1fr 1fr}
  .preview{height:520px}
  .drawer{width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
#gate{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:var(--bg);padding:16px}
#gate form{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px}
#gate h2{font-family:'Cormorant Garamond',serif;font-size:28px;color:var(--ink);margin-bottom:4px}
#gate p{color:var(--tx2);margin-bottom:14px}
#gate label{display:block;font-weight:600;margin:12px 0 4px}
#gate input[type=text],#gate input[type=password]{width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:var(--r-s);background:#fff}
#gate .rem{display:flex;gap:8px;align-items:center;margin:12px 0;font-weight:400}
#gate button{width:100%;padding:11px;border:none;border-radius:var(--r-s);background:var(--ink);color:#fff;font-weight:700}
#g-err{color:var(--red);min-height:18px;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div id="gate"><form onsubmit="gateGo();return false" autocomplete="off"><h2>Azraah</h2><p>Business dashboard. Sign in to continue.</p>
<label for="g-url">Web app URL</label><input type="text" id="g-url" placeholder="https://script.google.com/macros/s/.../exec" inputmode="url">
<label for="g-key">Passcode</label><input type="password" id="g-key" autocomplete="current-password">
<label class="rem"><input type="checkbox" id="g-rem"> Keep me signed in on this device</label>
<button type="submit">Sign in</button><div id="g-err" role="alert"></div></form></div>
<div class="loading" id="loading"><b>Azraah</b><div class="spin"></div><span>Opening your sheet&hellip;</span></div>

<div class="app">
  <aside class="side">
    <div class="brand"><b>Azraah</b><small>Business dashboard</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="side-foot"></div>
  </aside>
  <main>
    <div id="demo"></div>
    <div class="top"><h1 id="title">Overview</h1><span class="sp"></span><span class="upd" id="upd"></span>
      <button class="btn s" onclick="reload()" aria-label="Refresh data from the sheet">Refresh</button></div>
    <div id="view"></div>
  </main>
</div>
<nav class="tabs" id="tabs"></nav>
<div class="more-menu" id="more"></div>

<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-title">
  <div class="dr-h"><h3 id="dr-title"></h3><span class="sp"></span><span id="dr-tag"></span><button class="x" onclick="closeDrawer()" aria-label="Close">&times;</button></div>
  <div class="dr-b" id="dr-b"></div>
  <div class="dr-f" id="dr-f"></div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* =================== basics =================== */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rs = n => '₹' + Math.round(Number(n) || 0).toLocaleString('en-IN');
const fg = g => { g = Number(g) || 0; return Math.abs(g) >= 1000 ? +(g / 1000).toFixed(2) + ' kg' : g + ' g'; };
const DAY = 864e5;
const dt = ms => ms ? new Date(ms).toLocaleDateString('en-IN', { day:'numeric', month:'short' }) : '–';
const dtY = ms => ms ? new Date(ms).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' }) : '–';
const ago = ms => { if (!ms) return '–'; const d = Math.floor((Date.now() - ms) / DAY); return d <= 0 ? 'today' : d === 1 ? 'yesterday' : d < 31 ? d + ' days ago' : dt(ms); };
const toISO = d => new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const waLink = (ph, text) => { let d = String(ph || '').replace(/\D/g, ''); if (d.length === 10) d = '91' + d; return d ? `https://wa.me/${d}${text ? '?text=' + encodeURIComponent(text) : ''}` : ''; };
const ACTIVE = s => s === 'Confirmed' || s === 'Packed' || s === 'Delivered';
const isEmail = e => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(e || ''));
const packs = g => ({ k: Math.floor(g / 1000), h: Math.floor((g % 1000) / 500), q: Math.round((g % 500) / 250) });
const priceFor = (r, g) => { const p = packs(g); return p.k * (r.p1kg || r.p250 * 4) + p.h * (r.p500 || r.p250 * 2) + p.q * r.p250; };

let D = null;          // raw data from the sheet
let X = {};            // derived numbers
const UI = { view:'overview', period:'30', ost:'Pending', oq:'', cseg:'all', cq:'', sel:new Set(), mail:null, mper:'month' };

const ICON = {
  overview:'<path d="M3 13h7V3H3zm11 8h7V11h-7zM3 21h7v-6H3zm11-12h7V3h-7z"/>',
  orders:'<path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"/>',
  stock:'<path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',
  products:'<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/>',

const LIVE = true;
const CFG = { url: '', key: '' };
const DEFAULT_URL = ''; // optional: paste your web app /exec URL here so the sign-in box is pre-filled
function call(action, p){
  return fetch(CFG.url, { method: 'POST', redirect: 'follow', body: JSON.stringify({ adminKey: CFG.key, action: action, p: p || {} }) })
    .then(r => r.json())
    .then(j => { if (!j || j.ok === false) throw new Error((j && j.error) || 'Request failed'); return j; })
    .catch(e => { throw (e instanceof TypeError ? new Error('Could not reach the shop web app. Check the URL and your internet.') : e); });
}
async function reload(){
  try { const r = await call('load'); setData(r.data); }
  catch (e) { toast(errMsg(e), true); }
  finally { $('loading').style.display = 'none'; }
}
async function act(action, p, okMsg, btn){
  if (btn) btn.classList.add('busy');
  try {
    const r = await call(action, p);
    if (r.data) setData(r.data);
    toast(typeof okMsg === 'function' ? okMsg(r) : okMsg);
    return r;
  } catch (e) { toast(errMsg(e), true); throw e; }
  finally { if (btn) btn.classList.remove('busy'); }
}
const errMsg = e => String(e && e.message || e).replace(/^Exception:\s*/, '');

/* =================== derive numbers =================== */
function derive(){
  const orders = D.orders.slice().sort((a, b) => (b.date || 0) - (a.date || 0));
  const rateBy = {}; D.rates.forEach(r => rateBy[r.item.toLowerCase()] = r);

  // stock: purchases & adjustments in the Stock Ledger, minus what confirmed/delivered orders took out
  const st = {};
  const S = name => { const k = name.toLowerCase(); return st[k] || (st[k] = { item:name, inG:0, buyG:0, buyCost:0, soldG:0, resG:0, entries:0 }); };
  D.rates.forEach(r => S(r.item));
  D.ledger.forEach(l => { const s = S(l.item); s.inG += l.grams; s.entries++; if (l.grams > 0 && l.cost) { s.buyG += l.grams; s.buyCost += l.cost; } });
  orders.forEach(o => o.lines.forEach(l => { const s = S(l.item); if (ACTIVE(o.status)) s.soldG += l.grams; else if (o.status === 'Pending') s.resG += l.grams; }));
  const stock = Object.values(st).map(s => {
    const reorder = D.reorder[s.item] || D.reorder[Object.keys(D.reorder).find(k => k.toLowerCase() === s.item.toLowerCase())] || 0;
    const onHand = s.inG - s.soldG, avail = onHand - s.resG, costKg = s.buyG ? s.buyCost / s.buyG * 1000 : 0;
    const r = rateBy[s.item.toLowerCase()];
    const tracked = s.entries > 0;
    const level = !tracked ? 'na' : onHand <= 0 ? 'out' : (avail <= reorder || avail <= 0) ? 'low' : 'ok';
    return { ...s, onHand, avail, reorder, costKg, rate:r, tracked, level, selling: r && r.available && r.p250 > 0 };
  }).sort((a, b) => (b.selling - a.selling) || a.item.localeCompare(b.item));
  const costKg = {}; stock.forEach(s => costKg[s.item.toLowerCase()] = s.costKg);

  // customers: sign-ups + everyone who ordered, matched by email or phone
  const cust = {}, keyOf = (e, p) => (e && isEmail(e)) ? e.toLowerCase() : (p ? 'p' + String(p).slice(-10) : '');
  const byPhone = {};
  const C = (e, p, name) => {
    let k = keyOf(e, p); if (!k) return null;
    const pk = p ? String(p).slice(-10) : '';
    if (!cust[k] && pk && byPhone[pk]) k = byPhone[pk];
    const c = cust[k] || (cust[k] = { key:k, name:'', email:'', phone:'', orders:[], spend:0, first:null, last:null, signup:null });
    if (name && !c.name) c.name = name; if (isEmail(e) && !c.email) c.email = e.toLowerCase(); if (p && !c.phone) c.phone = p;
    if (pk) byPhone[pk] = k;
    return c;
  };
  D.customers.forEach(c => { const x = C(c.email, c.phone, c.name); if (x) x.signup = c.first; });
  orders.slice().reverse().forEach(o => { const c = C(o.email, o.phone, o.name); if (!c) return; c.name = o.name || c.name;
    if (o.status === 'Cancelled') return; c.orders.push(o); c.spend += o.total;
    c.first = c.first ? Math.min(c.first, o.date) : o.date; c.last = c.last ? Math.max(c.last, o.date) : o.date; });
  const customers = Object.values(cust).map(c => {
    const n = c.orders.length, since = c.last ? (Date.now() - c.last) / DAY : null;
    const seg = !n ? 'noorder' : since > 45 ? 'lapsed' : n >= 2 ? 'repeat' : 'new';
    return { ...c, n, seg, since };
  }).sort((a, b) => (b.last || b.signup || 0) - (a.last || a.signup || 0));
  const custEmails = new Set(customers.filter(c => c.n).map(c => c.email));
  const leads = D.visitors.filter(v => !v.ordered && isEmail(v.email) && !custEmails.has(v.email));

  X = { orders, stock, customers, leads, rateBy, costKg,
        pending: orders.filter(o => o.status === 'Pending'),
        unpaid: orders.filter(o => ACTIVE(o.status) && o.payment !== 'Paid') };
}

function periodRange(p){
  const now = new Date();
  if (p === '7') return [Date.now() - 7 * DAY, Infinity];
  if (p === '30') return [Date.now() - 30 * DAY, Infinity];
  if (p === 'month') return [new Date(now.getFullYear(), now.getMonth(), 1).getTime(), Infinity];
  if (p === 'last') return [new Date(now.getFullYear(), now.getMonth() - 1, 1).getTime(), new Date(now.getFullYear(), now.getMonth(), 1).getTime()];
  return [0, Infinity];
}
function stats(p){
  const [a, b] = periodRange(p), inP = t => t >= a && t < b;
  const sold = X.orders.filter(o => ACTIVE(o.status) && inP(o.date));
  const placed = X.orders.filter(o => o.status !== 'Cancelled' && inP(o.date));
  const revenue = sold.reduce((s, o) => s + o.total, 0);
  let cogs = 0, cogsKnown = true;
  sold.forEach(o => o.lines.forEach(l => { const c = X.costKg[l.item.toLowerCase()]; if (c) cogs += c * l.grams / 1000; else cogsKnown = false; }));
  const expenses = D.expenses.filter(e => inP(e.date)).reduce((s, e) => s + e.amount, 0);
  const newCust = X.customers.filter(c => c.first && inP(c.first)).length;
  const buyers = new Set(placed.map(o => o.email || o.phone)).size;
  const repeatBuyers = X.customers.filter(c => c.n >= 2 && c.orders.some(o => inP(o.date))).length;
  const items = {};
  sold.forEach(o => o.lines.forEach(l => { const it = items[l.item] || (items[l.item] = { item:l.item, amount:0, grams:0 }); it.amount += l.amount; it.grams += l.grams; }));
  const purchases = D.ledger.filter(l => l.grams > 0 && l.cost && inP(l.date)).reduce((s, l) => s + l.cost, 0);
  return { a, b, sold, placed, revenue, cogs, cogsKnown, expenses, purchases, newCust, buyers, repeatBuyers,
           aov: sold.length ? revenue / sold.length : 0, top: Object.values(items).sort((x, y) => y.amount - x.amount) };
}

function drawSales(s){
  const el = $('ch-sales'); if (!el) return;
  const start = s.a > 0 ? s.a : (X.orders.length ? X.orders[X.orders.length - 1].date : Date.now() - 30 * DAY);
  const days = Math.min(90, Math.max(7, Math.ceil((Date.now() - start) / DAY)));
  const keys = [], vals = [];
  for (let i = days - 1; i >= 0; i--) { keys.push(toISO(new Date(Date.now() - i * DAY))); vals.push(0); }
  s.sold.forEach(o => { const i = keys.indexOf(toISO(new Date(o.date))); if (i >= 0) vals[i] += o.total; });
  const max = Math.max(...vals);
  if (!max) { el.innerHTML = '<div class="empty">No confirmed sales in this period yet.</div>'; return; }
  const nice = (() => { const m = Math.pow(10, Math.floor(Math.log10(max))); return Math.ceil(max / m) * m; })();
  const W = 600, H = 230, L = 44, B = 24, T = 8, bw = (W - L) / days;
  const y = v => T + (H - T - B) * (1 - v / nice);
  const grid = [0, .5, 1].map(f => `<line x1="${L}" x2="${W}" y1="${y(nice * f)}" y2="${y(nice * f)}" stroke="#EEE9F1"/><text x="${L - 6}" y="${y(nice * f) + 4}" text-anchor="end" font-size="11" fill="#8A8092">${nice * f >= 1000 ? '₹' + (nice * f / 1000) + 'k' : '₹' + nice * f}</text>`).join('');
  const step = Math.ceil(days / 7);
  const bars = vals.map((v, i) => `<rect x="${L + i * bw + bw * .15}" y="${y(v)}" width="${Math.max(1, bw * .7)}" height="${Math.max(0, H - B - y(v))}" rx="2" fill="${v ? '#C9973F' : 'transparent'}"><title>${dt(new Date(keys[i]).getTime())}: ${rs(v)}</title></rect>`
    + (i % step === 0 ? `<text x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="11" fill="#8A8092">${dt(new Date(keys[i]).getTime())}</text>` : '')).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sales by day, highest ${rs(max)}">${grid}${bars}</svg>
    <p class="hint">Best day: ${rs(max)} on ${dt(new Date(keys[vals.indexOf(max)]).getTime())}. Hover a bar for its total.</p>`;
}

async function setStatus(id, status, btn){

async function setPaid(id, paid, btn){

function addItemRow(){
  const q = [250,500,750,1000,1500,2000,2500,3000,4000,5000].map(g => `<option value="${g}">${fg(g)}</option>`).join('');
  const d = document.createElement('div'); d.className = 'itemrow';
  const used = orderLines ? [...document.querySelectorAll('#no-items .itemrow select:first-child')].map(x => x.value) : [];
  const next = (window._items.find(r => !used.includes(r.item)) || window._items[0] || {}).item;
  d.innerHTML = `<select class="in" onchange="orderSum()" aria-label="Item">${window._items.map(r => `<option ${r.item === next ? 'selected' : ''}>${esc(r.item)}</option>`).join('')}</select><select class="in" onchange="orderSum()" aria-label="Quantity">${q}</select><button class="x" onclick="this.parentNode.remove();orderSum()" aria-label="Remove item">&times;</button>`;
  $('no-items').appendChild(d); orderSum();
}
function orderLines(){ return [...document.querySelectorAll('#no-items .itemrow')].map(r => { const s = r.querySelectorAll('select'); return { item:s[0].value, grams:Number(s[1].value) }; }); }
function orderSum(){
  if (!$('no-sum')) return;
  let sub = 0; orderLines().forEach(l => { const r = X.rateBy[l.item.toLowerCase()]; if (r) sub += priceFor(r, l.grams); });
  const fee = Number($('no-fee').value) || 0, disc = Number($('no-disc').value) || 0;
  $('no-sum').innerHTML = `<div><span>Items</span><span>${rs(sub)}</span></div><div><span>Handling</span><span>${rs(fee)}</span></div>${disc ? `<div><span>Discount</span><span>−${rs(disc)}</span></div>` : ''}<div class="t"><span>Total</span><span>${rs(sub + fee - Math.min(disc, sub))}</span></div>`;
}
function fillCust(name){
  const c = X.customers.find(x => x.name.toLowerCase() === String(name).toLowerCase()); if (!c) return;
  if (!$('no-phone').value) $('no-phone').value = c.phone || '';
  if (!$('no-email').value) $('no-email').value = c.email || '';
  const lastAddr = c.orders.length ? c.orders[c.orders.length - 1].address : '';
  if (!$('no-addr').value) $('no-addr').value = lastAddr || '';
}
async function saveOrder(btn){
  const p = { name:$('no-name').value, phone:$('no-phone').value, email:$('no-email').value, address:$('no-addr').value,
    items:orderLines(), fee:$('no-fee').value, discount:$('no-disc').value, source:$('no-src').value, notes:$('no-notes').value,
    status:$('no-status').value, sendReceipt:$('no-rcpt').checked };
  if (!p.name.trim()) return toast('Add the customer name.', true);
  const r = await act('order', p, r => `${r.orderId} saved for ${rs(r.total)}${r.invoiced ? '. Invoice emailed.' : r.emailed ? '. Customer emailed.' : '.'}`, btn);
  if (r) { UI.ost = p.status; go('orders'); }
}

    extra = { orderId:id, total, invoiced:p.status === 'Confirmed' && !!p.email }; }
  if (action === 'email') { p.to.forEach(r => d.emails.push({ at:Date.now(), to:r.email, name:r.name, subject:p.subject.replace(/\{first\}/g, (r.name || '').split(' ')[0]), type:p.type, status:p.mode === 'draft' ? 'Draft' : 'Sent' }));

}

async function gateGo(){
  const url = $('g-url').value.trim(), key = $('g-key').value;

}
